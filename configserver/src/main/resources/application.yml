server:
  port: 8888

spring:
  application:
    name: dps-config-server
  profiles:
    active:
    - native
  cloud:
    config:
      server:
        # Native profile (for local development - files from classpath/filesystem)
        native:
          search-locations:
            - classpath:/config
            - file:./dps-config-repo
    # Cloud Bus for dynamic config refresh
    bus:
      enabled: false # temporary disabled
      refresh:
        enabled: true

  # Kafka configuration for Cloud Bus
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: config-server-group
      auto-offset-reset: earliest

    
# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,bus-refresh,env
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/config-server.log