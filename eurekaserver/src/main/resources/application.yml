spring:
  application:
    name: eureka-server

server:
  port: ${EUREKA_PORT:8761}

# Eureka Server Configuration
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
    registry-fetch-interval-seconds: 30
  
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: 60000
    
    response-cache-update-interval-ms: 30000
    response-cache-auto-expiration-in-seconds: 180
    
    renewal-percent-threshold: 0.85
    renewal-threshold-update-interval-ms: 900000
    
    disable-delta: false
    

    max-threads-for-peer-replication: 20
    min-threads-for-peer-replication: 5
    
  
    wait-time-in-ms-when-sync-empty: 0
    
    rate-limiter-enabled: true
    rate-limiter-burst-size: 10
    rate-limiter-registry-fetch-average-rate: 500
    rate-limiter-full-fetch-average-rate: 100

  dashboard:
    enabled: true
    path: /


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,eureka
  endpoint:
    health:
      show-details: always
    eureka:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    diskspace:
      enabled: true
    db:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    com.dpps.eureka: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/eureka-server.log
    max-size: 10MB
    max-history: 30

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

eureka:
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG

---

spring:
  config:
    activate:
      on-profile: prod

eureka:
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000

logging:
  level:
    root: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    com.dpps.eureka: INFO
