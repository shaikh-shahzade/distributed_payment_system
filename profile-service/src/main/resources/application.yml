server:
  port: 8088
  
  
spring:
  application:
    name: dps-profile-service
  config:
    import: "configserver:http://localhost:8888"
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/profile_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
   
   # Schema Initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      encoding: UTF-8


  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 1800000    # 30 minutes 


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    'com.dps.profile_service': DEBUG
    'org.springframework.cache': TRACE
    'org.springframework.data.redis': DEBUG
    'org.hibernate.SQL': DEBUG
    